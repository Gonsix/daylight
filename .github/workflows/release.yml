name: Release plugin
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check release tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== JSON.parse(require("fs").readFileSync("manifest.json")).version) process.exit(1)'
      - run: npm ci
      - run: npm run release:prepare
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*/main.js
            dist/*/manifest.json
            dist/*/styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$GITHUB_REF_NAME/main.js" \
            "dist/$GITHUB_REF_NAME/manifest.json" \
            "dist/$GITHUB_REF_NAME/styles.css" \
            --verify-tag --title "Daylight $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" --latest
